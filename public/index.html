<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Việc cần làm</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="theme-btn" type="button" aria-label="Đổi giao diện sáng/tối"></button>
  <main class="container">

    <!-- Phần đăng nhập / đăng ký -->
    <section id="auth-section">
      <h1>Việc cần làm</h1>
      <form id="auth-form">
        <input id="email" type="email" placeholder="Email" required autocomplete="email">
        <input id="password" type="password" placeholder="Mật khẩu (ít nhất 6 ký tự)" required minlength="6" autocomplete="current-password">
        <div class="auth-buttons">
          <button type="submit">Đăng nhập</button>
          <button type="button" id="signup-btn" class="secondary">Đăng ký</button>
        </div>
        <p id="auth-msg"></p>
      </form>
    </section>

    <!-- Phần ứng dụng (chỉ hiện khi đã đăng nhập) -->
    <section id="app-section" hidden>
      <div class="topbar">
        <h1>Việc cần làm</h1>
        <button id="logout-btn" class="secondary">Đăng xuất</button>
      </div>
      <p id="user-email"></p>

      <!-- Màn hình 1: danh sách thư mục -->
      <div id="folders-view">
        <form id="folder-form">
          <input id="folder-input" type="text" placeholder="Tên thư mục (ví dụ: Ngày 18)" required maxlength="100">
          <button type="submit">Tạo thư mục</button>
        </form>
        <ul id="folder-list"></ul>
        <p id="folder-empty" hidden>Chưa có thư mục nào. Hãy tạo thư mục đầu tiên!</p>
      </div>

      <!-- Màn hình 2: việc bên trong một thư mục -->
      <div id="tasks-view" hidden>
        <div class="folder-head">
          <button id="back-btn" type="button" class="secondary">← Thư mục</button>
          <h2 id="folder-title"></h2>
        </div>

        <form id="task-form">
          <input id="task-input" type="text" placeholder="Nhập việc cần làm..." required maxlength="200">
          <input id="due-input" type="date" title="Hạn chót (không bắt buộc)">
          <button type="submit">Thêm</button>
        </form>

        <div id="filters">
          <button type="button" data-filter="all" class="filter active">Tất cả</button>
          <button type="button" data-filter="active" class="filter">Chưa xong</button>
          <button type="button" data-filter="done" class="filter">Đã xong</button>
        </div>
        <p id="count"></p>

        <ul id="task-list"></ul>
        <p id="empty-msg" hidden>Chưa có việc nào. Hãy thêm việc đầu tiên!</p>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
